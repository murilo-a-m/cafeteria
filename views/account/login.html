{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="auth-box">
    <h1>Entrar</h1>
    <form method="post" class="form">
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
        <label>E-mail
            <input type="email" name="email" value="{{ email }}" required autofocus>
        </label>
        <label>Senha
            <input type="password" name="password" required>
        </label>
        <button class="btn btn-block">Entrar</button>
    </form>
    <p class="center">Ainda não tem conta?
        <a href="{{ url_for('account.register', next=request.args.get('next', '')) }}">Cadastre-se</a>
    </p>
</div>
{% endblock %}
